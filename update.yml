name: update-dashboard
on:
  schedule:
    - cron: "30 8 * * 1-5"   # 16:30 台北時間，週一至週五（收盤資料已公布）
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: 抓取當日行情（idempotent，只補缺的交易日）
        run: python fetch_prices.py --start 2026-06-01
      - run: python build_groups.py && python build_data.py
      - name: 存回資料庫
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/prices.db && (git diff --cached --quiet || git commit -m "data: $(date +%F)") && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
